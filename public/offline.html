<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Offline · NebTech Pharmacy</title>
  <style>
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; background: #f8fafc; color: #0f172a; padding: 16px; box-sizing: border-box; }
    .card { max-width: 420px; background: #fff; border: 1px solid #e2e8f0; border-radius: 16px; padding: 32px; text-align: center; box-shadow: 0 1px 3px rgba(0,0,0,.06); }
    img { width: 56px; height: 56px; border-radius: 12px; }
    h1 { font-size: 20px; margin: 16px 0 8px; }
    p { color: #64748b; font-size: 14px; line-height: 1.5; margin: 0 0 20px; }
    .row { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; }
    a, button { font: inherit; font-size: 14px; font-weight: 600; border-radius: 10px; padding: 10px 16px; cursor: pointer; text-decoration: none; }
    button { background: #0f766e; color: #fff; border: 0; }
    a { background: #fff; color: #0f172a; border: 1px solid #cbd5e1; }
  </style>
</head>
<body>
  <div class="card">
    <img src="/images/icons/icon-192.png" alt="" />
    <h1>You're offline</h1>
    <p>This page hasn't been saved on this device yet. Pages you've opened before, like the till, still work without internet.</p>
    <div class="row">
      <button onclick="location.reload()">Try again</button>
      <a href="/pos">Open the till</a>
    </div>
  </div>
  <script>window.addEventListener("online", () => location.reload());</script>
</body>
</html>
